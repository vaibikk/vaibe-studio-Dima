<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Барбершоп «Борода» — онлайн-запись</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f3;--surface:#fff;--ink:#1b2126;--muted:#5d6a73;--line:#d3dadf;--accent:#0f9d94;--on-accent:#fff;
--font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--surface:#1e252b;--ink:#eef2f4;--muted:#9aa7b0;--line:#2f3a42;--accent:#2ee6d6;--on-accent:#0b1a19}}
:root[data-theme="dark"]{--bg:#14181c;--surface:#1e252b;--ink:#eef2f4;--muted:#9aa7b0;--line:#2f3a42;--accent:#2ee6d6;--on-accent:#0b1a19}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header{padding:20px 0 4px;font-weight:800;font-size:22px}
.lead{color:var(--muted);margin:0 0 20px}
h2{font-size:15px;margin:26px 0 10px;font-weight:800}
.opts{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:15px}
.opt{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left}
.opt small{display:block;color:var(--muted)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
input{width:100%;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.sum{margin:18px 0 12px;font-weight:600}
.go{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:15px;font-weight:800;font-size:17px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.err{color:#d6453d}
footer{padding:28px 0 44px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>Борода</header>
<p class="lead">Барбершоп. Запишитесь онлайн за минуту.</p>
<h2>1. Услуга</h2><div class="opts" id="s"></div>
<h2>2. День</h2><div class="opts" id="d"></div>
<h2>3. Время</h2><div class="opts" id="t"></div>
<h2>4. Контакты</h2>
<input id="n" placeholder="Ваше имя" autocomplete="name">
<input id="p" placeholder="Телефон" inputmode="tel" autocomplete="tel">
<div class="sum" id="sum"></div>
<button class="go" id="go">Записаться</button>
<div class="msg" id="msg" hidden></div>
<footer>Демо-сайт для портфолио. Сделал <a href="https://t.me/vaibechekk" style="color:inherit">Дмитрий Гаврилов</a>.</footer>
</div>
<script>
var S=[["Стрижка",1200],["Стрижка + борода",1800],["Борода",800]];
var T=["10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"];
var WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
var days=[];for(var i=1;days.length<7;i++){var x=new Date();x.setDate(x.getDate()+i);if(x.getDay()!==0)days.push(x)}
var st={s:-1,d:-1,t:-1};
function p2(n){return n<10?"0"+n:""+n}
function dl(x){return WD[x.getDay()]+" "+p2(x.getDate())+"."+p2(x.getMonth()+1)}
function busy(d,t){return (d*3+t*5)%4===0}
function render(){
  var s=document.getElementById("s"),d=document.getElementById("d"),t=document.getElementById("t");
  s.innerHTML=S.map(function(v,i){return '<button class="opt'+(st.s===i?' on':'')+'" data-k="s" data-i="'+i+'">'+v[0]+'<small>'+v[1]+' ₽</small></button>'}).join("");
  d.innerHTML=days.map(function(v,i){return '<button class="opt'+(st.d===i?' on':'')+'" data-k="d" data-i="'+i+'">'+dl(v)+'</button>'}).join("");
  t.innerHTML=T.map(function(v,i){var b=st.d>=0&&busy(st.d,i);return '<button class="opt'+(st.t===i?' on':'')+'" data-k="t" data-i="'+i+'"'+(b?' disabled':'')+'>'+v+'</button>'}).join("");
  document.getElementById("sum").textContent=(st.s>=0&&st.d>=0&&st.t>=0)?S[st.s][0]+", "+dl(days[st.d])+", "+T[st.t]+" — "+S[st.s][1]+" ₽":"";
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-k]");if(!b||b.disabled)return;
  var k=b.getAttribute("data-k"),i=+b.getAttribute("data-i");
  st[k]=i;if(k==="d"&&st.t>=0&&busy(i,st.t))st.t=-1;render();
});
document.getElementById("go").addEventListener("click",function(){
  var m=document.getElementById("msg"),n=document.getElementById("n").value.trim(),p=document.getElementById("p").value.trim();
  m.hidden=false;
  if(st.s<0||st.d<0||st.t<0||!n||!p){m.className="msg err";m.textContent="Выберите услугу, день и время и заполните имя и телефон.";return}
  m.className="msg";m.textContent="✅ "+n+", вы записаны: "+S[st.s][0]+", "+dl(days[st.d])+" в "+T[st.t]+". Это демо, реальная запись не создаётся.";
});
render();
</script>
</body>
</html>
